# PotterFlix - despliegue en Render (Static Site)
# React + Vite + TypeScript: el build emite la carpeta dist/.

services:
  - type: web
    name: potterflix
    runtime: static
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    # La app aun no usa router, pero el rewrite deja la base lista
    # por si mas adelante anades rutas con React Router.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # Los assets con hash de Vite nunca cambian: cacheamos un ano.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

      # El index.html no se cachea para que los despliegues se apliquen ya.
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate

      # Cabeceras de seguridad basicas.
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
